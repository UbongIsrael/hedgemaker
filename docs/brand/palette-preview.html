<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HedgeMaker — selected palette</title>
<style>*{box-sizing:border-box}body{margin:0;background:#F4F1E8;color:#111E26;font-family:system-ui,sans-serif}main{max-width:1480px;margin:auto;padding:20px}img{display:block;width:100%;height:auto}.copy{padding:24px 3%;border-top:1px solid #D4DBD4}h1{font-size:22px;font-weight:600}p{line-height:1.5;color:#53645E}.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}button{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid #71857A;border-radius:6px;padding:14px;background:#fff;color:#111E26;font:inherit;cursor:pointer}button:hover{background:#DCEEE4}button:focus-visible,a:focus-visible{outline:3px solid #2563EB;outline-offset:3px}.dot{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:var(--swatch);border:1px solid #71857A}small{display:block;color:#53645E;margin-top:4px;font:12px monospace}a{color:#2563EB}#status{min-height:24px;color:#0B493A}@media(max-width:780px){main{padding:8px}.swatches{grid-template-columns:repeat(2,minmax(0,1fr))}button{padding:10px;font-size:14px}}@media(max-width:430px){.swatches{grid-template-columns:1fr}}</style>
<main><img src="palette.svg" alt="HedgeMaker naira-inspired palette sheet: green primary, paper and ink neutrals, blue, lime and clay accents, mint and burgundy support; three original decorative patterns."><section class="copy"><h1>Explore the palette</h1><p>Select a color to copy its hex value. This is the selected HedgeMaker palette. Color roles and usage rules are in design.md.</p><div class="swatches"><button type="button" data-hex="#0B493A" style="--swatch:#0B493A"><span class="dot"></span><span>Banknote green<small>#0B493A · Copy hex</small></span></button><button type="button" data-hex="#F4F1E8" style="--swatch:#F4F1E8"><span class="dot"></span><span>Naira paper<small>#F4F1E8 · Copy hex</small></span></button><button type="button" data-hex="#111E26" style="--swatch:#111E26"><span class="dot"></span><span>Engraved ink<small>#111E26 · Copy hex</small></span></button><button type="button" data-hex="#2563EB" style="--swatch:#2563EB"><span class="dot"></span><span>Trust blue<small>#2563EB · Copy hex</small></span></button><button type="button" data-hex="#DAFF01" style="--swatch:#DAFF01"><span class="dot"></span><span>Electric lime<small>#DAFF01 · Copy hex</small></span></button><button type="button" data-hex="#B9472F" style="--swatch:#B9472F"><span class="dot"></span><span>Heritage clay<small>#B9472F · Copy hex</small></span></button><button type="button" data-hex="#DCEEE4" style="--swatch:#DCEEE4"><span class="dot"></span><span>Soft mint<small>#DCEEE4 · Copy hex</small></span></button><button type="button" data-hex="#701C2D" style="--swatch:#701C2D"><span class="dot"></span><span>Heritage burgundy<small>#701C2D · Copy hex</small></span></button></div><p id="status" role="status" aria-live="polite"></p><p><a href="palette.png" download>Download palette image</a> · <a href="palette.svg" download>Download vector sheet</a> · <a href="palette.json" download>Download tokens</a> · <a href="../../design.md">Read design notes</a></p></section></main>
<script>document.querySelectorAll('[data-hex]').forEach(button=>button.addEventListener('click',async()=>{const hex=button.dataset.hex;const status=document.getElementById('status');try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(hex)}else{const input=document.createElement('textarea');input.value=hex;input.setAttribute('aria-label','Color hex value');document.body.append(input);input.select();const copied=document.execCommand('copy');input.remove();if(!copied)throw Error('copy unavailable')}status.textContent=`Copied ${hex}`;}catch{status.textContent=`Color: ${hex}. Select and copy this value.`}}));</script></html>
